<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>足し算ドリル</title>
<style>
  :root{
    --bg-1:#12122b;
    --bg-2:#1c1c48;
    --panel:#25254f;
    --panel-edge:#34346f;
    --gold:#ffc857;
    --gold-deep:#e8a93f;
    --teal:#2ec4b6;
    --teal-deep:#20948a;
    --red:#ff6b6b;
    --ink:#f5f3ff;
    --ink-dim:#9c9bc7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    background:radial-gradient(120% 140% at 50% -10%, var(--bg-2), var(--bg-1) 60%);
    font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    color:var(--ink);
    touch-action:manipulation;
  }
  .stage{
    height:100dvh;
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    gap:6px;
  }
  .hurry-overlay{
    position:fixed; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 30%, rgba(255,90,90,.75), rgba(122,20,20,.55) 70%);
    opacity:0;
    transition:opacity 1.1s linear;
    mix-blend-mode:screen;
  }
  .hurry-overlay.urgent{ animation:hurryPulse 0.9s ease-in-out infinite; }
  @keyframes hurryPulse{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.5); }
  }
  .topbar{
    width:100%; max-width:520px;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }
  .mute-btn{
    width:34px; height:34px; border-radius:50%;
    background:var(--panel); border:1px solid var(--panel-edge);
    color:var(--ink); font-size:15px;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .mute-btn:active{ transform:scale(.92); }
  .diff-chip{
    font-size:12px; font-weight:800; letter-spacing:.04em;
    padding:6px 20px; border-radius:999px;
    color:#0c0c1f; background:var(--panel);
    flex:0 0 auto; white-space:nowrap;
    text-align:center;
  }
  .diff-chip.n-beginner{ background:var(--gold); }
  .diff-chip.n-intermediate{ background:var(--teal); }
  .diff-chip.n-advanced{ background:var(--red); color:#2a0c0c; }
  .score{
    font-size:11px; color:var(--ink-dim); font-weight:600;
    flex:0 0 auto; white-space:nowrap;
  }
  .level-tag{
    width:100%; max-width:520px; text-align:center;
    font-size:12px; letter-spacing:.02em; font-weight:700;
    padding:6px 10px; border-radius:999px;
    background:rgba(46,196,182,.15); color:var(--teal);
    border:1px solid rgba(46,196,182,.4);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:transform .25s ease;
  }
  .level-tag.pulse{ animation:pulseTag .5s ease; }
  @keyframes pulseTag{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.12); }
    100%{ transform:scale(1); }
  }
  .fuse{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; width:100%; max-width:520px; }
  .pip{
    width:14px; height:14px; border-radius:50%;
    background:var(--panel); border:2px solid var(--panel-edge);
    transition:transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .pip.good{ background:var(--gold); border-color:var(--gold-deep); box-shadow:0 0 8px 1px rgba(255,200,87,.6); transform:scale(1.1); }
  .pip.bad{ background:var(--red); border-color:#c94848; transform:scale(1.1); }
  .progress-caption{ font-size:11px; color:var(--ink-dim); font-weight:600; text-align:center; }
  .levelup{
    position:fixed; left:50%; top:14%;
    transform:translate(-50%,-10px);
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));
    color:#08211f; font-weight:800; font-size:14px; line-height:1.4;
    padding:12px 20px; border-radius:14px;
    box-shadow:0 10px 30px rgba(46,196,182,.4);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
    z-index:20; text-align:center; max-width:80vw;
  }
  .levelup.show{ opacity:1; transform:translate(-50%,0); }
  .card{
    width:100%; max-width:520px;
    background:linear-gradient(180deg, var(--panel), #20204a);
    border:1px solid var(--panel-edge);
    border-radius:22px;
    padding:14px 12px;
    flex: 0 0 auto;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
  }
  .card.shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(3px);}
  }
  .equation{
    display:flex; align-items:baseline; justify-content:center;
    flex-wrap:wrap; gap:6px;
    font-family: ui-rounded, -apple-system, "Hiragino Sans", sans-serif;
    font-weight:800;
    font-size:clamp(34px, 11vw, 58px);
    letter-spacing:.01em;
  }
  .num{ color:var(--ink); }
  .op{ color:var(--gold); margin:0 1px;}
  .eq{ color:var(--ink-dim); margin:0 1px;}
  .answer-box{
    min-width:1.4em;
    display:inline-flex; align-items:center; justify-content:center;
    padding:0 .16em;
    border-bottom:4px solid var(--gold);
    color:var(--gold);
  }
  .answer-box.empty::after{ content:"?"; color:var(--ink-dim); }
  .answer-box.wrong{ color:var(--red); border-bottom-color:var(--red); text-decoration:line-through; opacity:.6; font-size:.75em; }
  .answer-box.correct{
    color:#1a1400; background:var(--gold);
    border-bottom:none; border-radius:10px;
    padding:2px 14px; margin-left:2px;
    font-size:1.15em; font-weight:900;
    box-shadow:0 0 18px 3px rgba(255,200,87,.75);
    animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn{
    0%{ transform:scale(0.4); opacity:0; }
    70%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); }
  }
  .correct-arrow{ color:var(--ink-dim); margin:0 2px; font-weight:700; }
  .feedback{
    text-align:center; min-height:20px;
    font-size:13px; font-weight:700; margin-top:8px;
    color:var(--ink-dim); transition:color .15s ease;
  }
  .feedback.good{ color:var(--gold); }
  .feedback.bad{ color:var(--red); }
  .keypad{
    width:100%; max-width:520px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:7px;
    flex:1 1 auto;
    min-height:0;
  }
  .key{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:16px;
    color:var(--ink);
    font-size:clamp(26px, 7.5vw, 36px);
    font-weight:700;
    font-family: ui-rounded, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    transition:transform .08s ease, background .12s ease;
  }
  .key:active{ transform:scale(.93); background:#30306a; }
  .key.func{ color:var(--ink-dim); font-size:clamp(16px,4.2vw,20px); }
  .submit{
    width:100%; max-width:520px;
    flex:0 0 auto;
    border:none; border-radius:16px;
    padding:12px;
    font-size:16px; font-weight:800;
    font-family: ui-rounded, -apple-system, sans-serif;
    letter-spacing:.02em;
    background:linear-gradient(135deg, var(--gold), var(--gold-deep));
    color:#3a2600;
    box-shadow:0 10px 24px rgba(255,200,87,.3);
    transition:transform .08s ease, opacity .2s ease;
  }
  .submit:active{ transform:scale(.98); }
  .submit:disabled{ opacity:.4; }

  /* ---- overlays (start screen & results) ---- */
  .overlay{
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    background:radial-gradient(120% 120% at 50% 20%, rgba(46,196,182,.2), rgba(18,18,43,.97));
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
    text-align:center; padding:22px;
    overflow:hidden;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .overlay h1{
    font-family: ui-rounded, -apple-system, sans-serif;
    font-size:clamp(24px, 7.5vw, 36px);
    margin:0 0 2px; color:var(--gold);
    text-shadow:0 4px 20px rgba(255,200,87,.4);
  }
  .overlay h1.celebrate{ animation:celebrateBounce 0.9s ease infinite; }
  @keyframes celebrateBounce{
    0%,100%{ transform:scale(1) rotate(0deg); }
    25%{ transform:scale(1.12) rotate(-3deg); }
    50%{ transform:scale(1.05) rotate(0deg); }
    75%{ transform:scale(1.12) rotate(3deg); }
  }
  .overlay .sub{ margin:0 0 6px; color:var(--ink-dim); font-size:13px; font-weight:600; }
  .choice-card{
    width:100%; max-width:360px;
    background:var(--panel); border:1px solid var(--panel-edge);
    border-radius:16px; padding:14px 16px;
    text-align:left; color:var(--ink);
  }
  .choice-card:active{ transform:scale(.98); }
  .choice-card .name{
    display:block;
    width:fit-content;
    margin:0 auto 6px;
    text-align:center;
    font-size:16px; font-weight:800; font-family: ui-rounded, -apple-system, sans-serif;
    padding:6px 30px; border-radius:8px;
    color:#0c0c1f;
  }
  .choice-card .name.n-beginner{ background:var(--gold); }
  .choice-card .name.n-intermediate{ background:var(--teal); }
  .choice-card .name.n-advanced{ background:var(--red); color:#2a0c0c; }
  .choice-card .desc{ font-size:12px; color:var(--ink-dim); margin-top:3px; font-weight:600; }
  .result-score{
    font-family: ui-rounded, -apple-system, sans-serif;
    font-size:clamp(30px, 9vw, 46px); font-weight:800; color:var(--ink); margin:2px 0;
  }
  .result-msg{ font-size:14px; font-weight:700; color:var(--teal); max-width:340px; line-height:1.5; }
  .btn-row{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; margin-top:4px; }
  .action-btn{
    border:none; border-radius:16px; padding:14px 20px;
    font-size:15px; font-weight:800; font-family: ui-rounded, -apple-system, sans-serif;
    box-shadow:0 10px 22px rgba(0,0,0,.25);
  }
  .action-btn.primary{ background:linear-gradient(135deg, var(--gold), var(--gold-deep)); color:#3a2600; }
  .action-btn.secondary{ background:linear-gradient(135deg, var(--teal), var(--teal-deep)); color:#08211f; }
  .action-btn.ghost{ background:transparent; color:var(--ink-dim); border:1px solid var(--panel-edge); box-shadow:none; }
  .action-btn:active{ transform:scale(.97); }
  .confetti{
    position:absolute; top:-10px; border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{ to{ transform:translateY(115vh) rotate(360deg); } }
</style>
</head>
<body>

<div class="hurry-overlay" id="hurryOverlay"></div>
<div class="stage">
  <div class="topbar">
    <button class="mute-btn" id="muteBtn">🔊</button>
    <div class="diff-chip" id="diffChip">きゅう みせんたく</div>
    <div class="score" id="score">0/0</div>
  </div>

  <div class="level-tag" id="levelTag">れべる 1/7 ・ 1けた + 1けた</div>

  <div class="fuse" id="fuse"></div>
  <div class="progress-caption" id="progressCaption"></div>

  <div class="card" id="card">
    <div class="equation" id="equation"></div>
    <div class="feedback" id="feedback">すうじを えらんで こたえよう</div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key func" data-k="clear">けす</button>
    <button class="key" data-k="0">0</button>
    <button class="key func" data-k="back">⌫</button>
  </div>

  <button class="submit" id="submit">こたえる</button>
</div>

<div class="levelup" id="levelup"></div>

<!-- start screen -->
<div class="overlay show" id="startScreen">
  <h1>✏️ 足し算ドリル</h1>
  <p class="sub">きゅうを えらんで スタート！</p>
  <button class="choice-card" data-diff="beginner">
    <div class="name n-beginner">初級</div>
    <div class="desc">れべる1〜2・各10問（1けたのたしざん・3つのたしざん）</div>
  </button>
  <button class="choice-card" data-diff="intermediate">
    <div class="name n-intermediate">中級</div>
    <div class="desc">れべる3〜4・各10問（1けた+2けた・3つのうち1つが2けた）</div>
  </button>
  <button class="choice-card" data-diff="advanced">
    <div class="name n-advanced">上級</div>
    <div class="desc">れべる5〜7・2けた+2けた(10問)〜2けた×3(5問)</div>
  </button>
</div>

<!-- results screen -->
<div class="overlay" id="resultScreen">
  <h1 id="resultTitle">けっか</h1>
  <div class="result-score" id="resultScore">0 / 0</div>
  <div class="result-msg" id="resultMsg"></div>
  <div class="btn-row" id="resultBtns"></div>
</div>

<script>
(function(){
  const LEVELS = [
    { pattern:[1,1],     label:"1けた + 1けた",           count:10 },
    { pattern:[1,1,1],   label:"1けたを3つ たしざん",      count:10 },
    { pattern:[1,2],     label:"1けた + 2けた",           count:10 },
    { pattern:[1,1,2],   label:"3つのうち1つが2けた",      count:10 },
    { pattern:[2,2],     label:"2けた + 2けた",           count:10 },
    { pattern:[1,2,2],   label:"3つのうち2つが2けた",      count:5  },
    { pattern:[2,2,2],   label:"2けた×3の たしざん",      count:5  },
  ];

  const DIFFICULTIES = {
    beginner:     { key:'beginner',     label:'初級', startLevel:0, endLevel:1, next:'intermediate', nextLabel:'中級' },
    intermediate: { key:'intermediate', label:'中級', startLevel:2, endLevel:3, next:'advanced',     nextLabel:'上級' },
    advanced:     { key:'advanced',     label:'上級', startLevel:4, endLevel:6, next:null,           nextLabel:null },
  };

  let diff = null;
  let currentLevelIndex = 0;
  let questionInLevel = 0;
  let pipStatus = [];
  let correctInRun = 0, totalInRun = 0;
  let nums = [], answer = 0, userInput = "";
  let locked = false, running = false;

  const fuseEl = document.getElementById('fuse');
  const levelTagEl = document.getElementById('levelTag');
  const progressCaptionEl = document.getElementById('progressCaption');
  const equationEl = document.getElementById('equation');
  const feedbackEl = document.getElementById('feedback');
  const cardEl = document.getElementById('card');
  const scoreEl = document.getElementById('score');
  const diffChipEl = document.getElementById('diffChip');
  const submitEl = document.getElementById('submit');
  const levelupEl = document.getElementById('levelup');
  const startScreenEl = document.getElementById('startScreen');
  const resultScreenEl = document.getElementById('resultScreen');
  const resultTitleEl = document.getElementById('resultTitle');
  const resultScoreEl = document.getElementById('resultScore');
  const resultMsgEl = document.getElementById('resultMsg');
  const resultBtnsEl = document.getElementById('resultBtns');
  const muteBtn = document.getElementById('muteBtn');
  const hurryOverlayEl = document.getElementById('hurryOverlay');

  /* ---------------- audio ---------------- */
  let audioCtx = null, sfxGain = null;
  let musicOn = true;
  const NOTE = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25 };
  let bgmGain = null;
  let bgmTimer = null;
  // Mozart, Piano Sonata No.16 in C major K.545, mvt.1 (right-hand melody, exposition),
  // transcribed from score data. Loops ~24s per pass (repeats like the exposition repeat
  // in performance), covering roughly the requested first ~45s of the piece across two passes.
  const MELODY = [
    {f:523.25,d:1.0},{f:659.26,d:0.5},{f:783.99,d:0.5},{f:493.88,d:0.75},
    {f:523.25,d:0.125},{f:587.33,d:0.125},{f:523.25,d:0.5},{f:null,d:0.5},
    {f:880.0,d:1.0},{f:783.99,d:0.5},{f:1046.5,d:0.5},{f:783.99,d:0.5},
    {f:698.46,d:0.25},{f:659.26,d:0.125},{f:698.46,d:0.125},{f:659.26,d:0.5},
    {f:null,d:0.5},{f:440.0,d:0.25},{f:493.88,d:0.125},{f:523.25,d:0.125},
    {f:587.33,d:0.125},{f:659.26,d:0.125},{f:698.46,d:0.125},{f:783.99,d:0.125},
    {f:880.0,d:0.125},{f:783.99,d:0.125},{f:698.46,d:0.125},{f:659.26,d:0.125},
    {f:587.33,d:0.125},{f:523.25,d:0.125},{f:493.88,d:0.125},{f:440.0,d:0.125},
    {f:392.0,d:0.25},{f:440.0,d:0.125},{f:493.88,d:0.125},{f:523.25,d:0.125},
    {f:587.33,d:0.125},{f:659.26,d:0.125},{f:698.46,d:0.125},{f:783.99,d:0.125},
    {f:698.46,d:0.125},{f:659.26,d:0.125},{f:587.33,d:0.125},{f:523.25,d:0.125},
    {f:493.88,d:0.125},{f:440.0,d:0.125},{f:392.0,d:0.125},{f:349.23,d:0.25},
    {f:392.0,d:0.125},{f:440.0,d:0.125},{f:493.88,d:0.125},{f:523.25,d:0.125},
    {f:587.33,d:0.125},{f:659.26,d:0.125},{f:698.46,d:0.125},{f:659.26,d:0.125},
    {f:587.33,d:0.125},{f:523.25,d:0.125},{f:493.88,d:0.125},{f:440.0,d:0.125},
    {f:392.0,d:0.125},{f:349.23,d:0.125},{f:329.63,d:0.25},{f:349.23,d:0.125},
    {f:392.0,d:0.125},{f:440.0,d:0.125},{f:493.88,d:0.125},{f:523.25,d:0.125},
    {f:587.33,d:0.125},{f:659.26,d:0.125},{f:587.33,d:0.125},{f:523.25,d:0.125},
    {f:493.88,d:0.125},{f:440.0,d:0.125},{f:392.0,d:0.125},{f:349.23,d:0.125},
    {f:329.63,d:0.125},{f:293.66,d:0.25},{f:329.63,d:0.125},{f:349.23,d:0.125},
    {f:392.0,d:0.125},{f:440.0,d:0.125},{f:493.88,d:0.125},{f:554.37,d:0.125},
    {f:587.33,d:0.125},{f:440.0,d:0.125},{f:493.88,d:0.125},{f:554.37,d:0.125},
    {f:587.33,d:0.125},{f:659.26,d:0.125},{f:698.46,d:0.125},{f:783.99,d:0.125},
    {f:880.0,d:0.125},{f:987.77,d:0.125},{f:1046.5,d:0.125},{f:987.77,d:0.125},
    {f:880.0,d:0.125},{f:783.99,d:0.125},{f:698.46,d:0.125},{f:659.26,d:0.125},
    {f:698.46,d:0.125},{f:783.99,d:0.125},{f:880.0,d:0.125},{f:783.99,d:0.125},
    {f:698.46,d:0.125},{f:659.26,d:0.125},{f:587.33,d:0.125},{f:523.25,d:0.125},
    {f:493.88,d:0.25},{f:783.99,d:0.25},{f:659.26,d:0.25},{f:523.25,d:0.25},
    {f:587.33,d:0.25},{f:783.99,d:0.25},{f:659.26,d:0.25},{f:523.25,d:0.25},
    {f:587.33,d:0.5},{f:783.99,d:0.5},{f:392.0,d:0.5},{f:null,d:0.5}
  ];
  let melodyIdx = 0;
  const TEMPO_SCALE = 1.3; // >1 = slower
  function playMelodyLoop(){
    if(!musicOn || !audioCtx) return;
    const note = MELODY[melodyIdx % MELODY.length];
    if(note.f) playTone(note.f, note.d * 0.95 * TEMPO_SCALE, 'sine', 0.18, bgmGain);
    melodyIdx++;
    bgmTimer = setTimeout(playMelodyLoop, note.d * 1000 * TEMPO_SCALE);
  }

  function initAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sfxGain = audioCtx.createGain();
      sfxGain.gain.value = 0.28;
      sfxGain.connect(audioCtx.destination);
      bgmGain = audioCtx.createGain();
      bgmGain.gain.value = 0.11;
      bgmGain.connect(audioCtx.destination);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(musicOn && !bgmTimer){ playMelodyLoop(); }
  }

  function playTone(freq, dur, type, peak, dest){
    if(!audioCtx || !freq) return;
    const osc = audioCtx.createOscillator();
    osc.type = type;
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = 0;
    osc.connect(g); g.connect(dest);
    const now = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(peak, now + 0.02);
    g.gain.linearRampToValueAtTime(0, now + dur);
    osc.start(now);
    osc.stop(now + dur + 0.03);
  }

  function sfxCorrect(){
    if(!audioCtx) return;
    playTone(659.25, .1, 'sine', 0.3, sfxGain);
    setTimeout(()=>playTone(880, .14, 'sine', 0.3, sfxGain), 90);
  }
  function sfxWrong(){
    if(!audioCtx) return;
    playTone(180, .22, 'sawtooth', 0.22, sfxGain);
  }
  function sfxLevelUp(){
    if(!audioCtx) return;
    [NOTE.C4, NOTE.E4, NOTE.G4, NOTE.C5].forEach((f,i)=>{
      setTimeout(()=>playTone(f, .18, 'square', 0.22, sfxGain), i*90);
    });
  }
  function sfxFanfare(){
    if(!audioCtx) return;
    const seq = [NOTE.C4, NOTE.E4, NOTE.G4, NOTE.C5, NOTE.G4, NOTE.C5, NOTE.D5, NOTE.E5, NOTE.C5, NOTE.E5, NOTE.G4 * 2, NOTE.E5];
    seq.forEach((f,i)=>{
      setTimeout(()=>playTone(f, .24, 'square', 0.28, sfxGain), i*120);
    });
  }

  ['touchend', 'mousedown', 'click', 'keydown'].forEach(evt => {
    document.addEventListener(evt, initAudio, { once:true, passive:true });
  });
  muteBtn.addEventListener('click', ()=>{
    musicOn = !musicOn;
    muteBtn.textContent = musicOn ? '🔊' : '🔇';
    if(musicOn && !bgmTimer){ playMelodyLoop(); }
    else if(!musicOn && bgmTimer){ clearTimeout(bgmTimer); bgmTimer = null; }
  });

  /* ---------------- helpers ---------------- */
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  const HURRY_START_MS = 6000;
  const HURRY_MAX_MS = 18000;
  let hurryInterval = null, questionStartTime = 0;

  function startHurryTimer(){
    clearHurryTimer();
    questionStartTime = Date.now();
    hurryInterval = setInterval(()=>{
      const elapsed = Date.now() - questionStartTime;
      const t = Math.min(Math.max((elapsed - HURRY_START_MS) / (HURRY_MAX_MS - HURRY_START_MS), 0), 1);
      hurryOverlayEl.style.opacity = (t * 0.7).toFixed(2);
      hurryOverlayEl.classList.toggle('urgent', t >= 0.7);
    }, 400);
  }
  function clearHurryTimer(){
    if(hurryInterval){ clearInterval(hurryInterval); hurryInterval = null; }
    hurryOverlayEl.style.opacity = 0;
    hurryOverlayEl.classList.remove('urgent');
  }

  function buildFuse(count){
    pipStatus = new Array(count).fill(null);
    fuseEl.innerHTML = "";
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'pip';
      fuseEl.appendChild(p);
    }
  }
  function renderFuse(){
    const pips = fuseEl.children;
    for(let i=0;i<pips.length;i++){
      pips[i].classList.remove('good','bad');
      if(pipStatus[i] === true) pips[i].classList.add('good');
      else if(pipStatus[i] === false) pips[i].classList.add('bad');
    }
  }

  function updateLevelTag(){
    levelTagEl.textContent = `れべる ${currentLevelIndex+1}/7 ・ ${LEVELS[currentLevelIndex].label}`;
    progressCaptionEl.textContent = `${questionInLevel}/${LEVELS[currentLevelIndex].count} 問`;
  }

  /* ---------------- game flow ---------------- */
  function startDifficulty(key){
    diff = DIFFICULTIES[key];
    currentLevelIndex = diff.startLevel;
    questionInLevel = 0;
    correctInRun = 0; totalInRun = 0;
    running = true;
    diffChipEl.textContent = diff.label;
    diffChipEl.className = 'diff-chip n-' + diff.key;
    scoreEl.textContent = "0/0";
    buildFuse(LEVELS[currentLevelIndex].count);
    updateLevelTag();
    startScreenEl.classList.remove('show');
    resultScreenEl.classList.remove('show');
    newQuestion();
  }

  function newQuestion(){
    if(!running) return;
    userInput = "";
    const pattern = shuffle(LEVELS[currentLevelIndex].pattern);
    nums = pattern.map(d => d === 1 ? randInt(1,9) : randInt(10,99));
    answer = nums.reduce((a,b)=>a+b, 0);
    renderEquation();
    feedbackEl.textContent = "すうじを えらんで こたえよう";
    feedbackEl.className = "feedback";
    locked = false;
    startHurryTimer();
  }

  function renderEquation(){
    let html = "";
    nums.forEach((n, i) => {
      html += `<span class="num">${n}</span>`;
      if(i < nums.length - 1) html += `<span class="op">＋</span>`;
    });
    html += `<span class="eq">＝</span>`;
    html += `<span class="answer-box ${userInput === '' ? 'empty' : ''}">${userInput}</span>`;
    equationEl.innerHTML = html;
  }

  function renderWrongAnswer(){
    let html = "";
    nums.forEach((n, i) => {
      html += `<span class="num">${n}</span>`;
      if(i < nums.length - 1) html += `<span class="op">＋</span>`;
    });
    html += `<span class="eq">＝</span>`;
    html += `<span class="answer-box wrong">${userInput}</span>`;
    html += `<span class="correct-arrow">→</span>`;
    html += `<span class="answer-box correct">${answer}</span>`;
    equationEl.innerHTML = html;
  }

  function updateScore(){
    scoreEl.textContent = `${correctInRun} / ${totalInRun}`;
  }

  function pressKey(k){
    if(locked || !running) return;
    if(k === 'clear'){ userInput = ""; }
    else if(k === 'back'){ userInput = userInput.slice(0, -1); }
    else { if(userInput.length < 3) userInput += k; }
    renderEquation();
  }

  function shakeCard(){
    cardEl.classList.remove('shake');
    void cardEl.offsetWidth;
    cardEl.classList.add('shake');
  }

  function showLevelUp(text){
    levelupEl.innerHTML = text;
    levelupEl.classList.add('show');
    setTimeout(()=> levelupEl.classList.remove('show'), 1600);
  }

  function launchConfetti(container, count){
    count = count || 40;
    const colors = ['#ffc857','#2ec4b6','#ff6b6b','#f5f3ff'];
    for(let i=0;i<count;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + 'vw';
      c.style.width = (6+Math.random()*6) + 'px';
      c.style.height = (6+Math.random()*10) + 'px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
      c.style.animationDelay = (Math.random()*0.6) + 's';
      container.appendChild(c);
      setTimeout(()=>c.remove(), 4500);
    }
  }
  function launchGrandCelebration(container, titleEl){
    launchConfetti(container, 90);
    setTimeout(()=> launchConfetti(container, 60), 500);
    setTimeout(()=> launchConfetti(container, 60), 1100);
    if(titleEl){
      titleEl.classList.remove('celebrate'); void titleEl.offsetWidth;
      titleEl.classList.add('celebrate');
      setTimeout(()=> titleEl.classList.remove('celebrate'), 3500);
    }
  }

  function makeBtn(label, cls, onClick){
    const b = document.createElement('button');
    b.className = 'action-btn ' + cls;
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function showResults(){
    running = false;
    clearHurryTimer();
    const pct = totalInRun > 0 ? Math.round((correctInRun/totalInRun)*100) : 0;
    resultScoreEl.textContent = `${correctInRun} / ${totalInRun}（${pct}%）`;
    resultBtnsEl.innerHTML = "";
    resultScreenEl.classList.remove('show');

    if(diff.key === 'advanced'){
      if(pct === 100){
        resultTitleEl.textContent = "🎉 コンプリート！";
        resultMsgEl.textContent = "ぜんもん せいかい！たしざん マスター、おめでとう！";
        sfxFanfare();
        if(bgmGain) bgmGain.gain.value = 0.05;
        resultScreenEl.classList.add('show');
        launchGrandCelebration(resultScreenEl, resultTitleEl);
      } else {
        resultTitleEl.textContent = "けっか";
        resultMsgEl.textContent = "おしい！100%を めざして もう一度 ちょうせんしよう！";
        sfxLevelUp();
      }
    } else {
      if(pct === 100){
        resultTitleEl.textContent = "🎉 コンプリート！";
        resultMsgEl.textContent = `ぜんもん せいかい！すごい！つぎは 「${diff.nextLabel}」に すすもう！`;
        sfxFanfare();
        if(bgmGain) bgmGain.gain.value = 0.05;
        launchGrandCelebration(resultScreenEl, resultTitleEl);
        resultBtnsEl.appendChild(makeBtn(`${diff.nextLabel}に すすむ`, 'primary', ()=> startDifficulty(diff.next)));
      } else if(pct >= 85){
        resultTitleEl.textContent = "けっか";
        resultMsgEl.textContent = `🎉 すごい！つぎは 「${diff.nextLabel}」に すすもう！`;
        sfxLevelUp();
        resultBtnsEl.appendChild(makeBtn(`${diff.nextLabel}に すすむ`, 'primary', ()=> startDifficulty(diff.next)));
      } else {
        resultTitleEl.textContent = "けっか";
        resultMsgEl.textContent = "もう少し れんしゅうしよう！";
        sfxWrong();
      }
    }

    resultBtnsEl.appendChild(makeBtn(`もう一度 ${diff.label}`, 'secondary', ()=> startDifficulty(diff.key)));
    resultBtnsEl.appendChild(makeBtn('きゅうを えらびなおす', 'ghost', ()=> {
      resultScreenEl.classList.remove('show');
      startScreenEl.classList.add('show');
      if(bgmGain) bgmGain.gain.value = 0.11;
    }));

    resultScreenEl.classList.add('show');
  }

  function submitAnswer(){
    if(locked || !running) return;
    if(userInput === "") return;
    locked = true;
    clearHurryTimer();
    totalInRun++;
    const given = parseInt(userInput, 10);
    const isCorrect = given === answer;

    if(isCorrect){
      correctInRun++;
      feedbackEl.textContent = "せいかい！ 🎉";
      feedbackEl.className = "feedback good";
      sfxCorrect();
    } else {
      feedbackEl.textContent = `ざんねん… こたえは ${answer}`;
      feedbackEl.className = "feedback bad";
      renderWrongAnswer();
      shakeCard();
      sfxWrong();
    }
    pipStatus[questionInLevel] = isCorrect;
    renderFuse();
    updateScore();
    questionInLevel++;

    if(questionInLevel >= LEVELS[currentLevelIndex].count){
      if(currentLevelIndex < diff.endLevel){
        currentLevelIndex++;
        questionInLevel = 0;
        buildFuse(LEVELS[currentLevelIndex].count);
        updateLevelTag();
        levelTagEl.classList.remove('pulse'); void levelTagEl.offsetWidth; levelTagEl.classList.add('pulse');
        showLevelUp(`つぎの れべるへ！<br>「${LEVELS[currentLevelIndex].label}」`);
        sfxLevelUp();
        setTimeout(newQuestion, 1200);
      } else {
        setTimeout(showResults, 900);
      }
    } else {
      updateLevelTag();
      setTimeout(newQuestion, 1100);
    }
  }

  document.getElementById('keypad').addEventListener('click', (e)=>{
    const btn = e.target.closest('.key');
    if(!btn) return;
    pressKey(btn.dataset.k);
  });
  submitEl.addEventListener('click', submitAnswer);
  startScreenEl.querySelectorAll('.choice-card').forEach(btn=>{
    btn.addEventListener('click', ()=> startDifficulty(btn.dataset.diff));
  });
})();
</script>

</body>
</html>
